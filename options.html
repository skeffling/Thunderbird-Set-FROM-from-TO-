<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
      padding: 16px;
    }
    h2 {
      margin-top: 0;
      font-size: 16px;
    }
    .account {
      margin: 8px 0;
    }
    label {
      cursor: pointer;
    }
    .email {
      color: #666;
      margin-left: 4px;
    }
    .saved {
      color: #2a2;
      margin-left: 8px;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .saved.show {
      opacity: 1;
    }
  </style>
</head>
<body>
  <h2>Enable for accounts:</h2>
  <div id="accounts"></div>
  <span id="saved" class="saved">Saved</span>
  <script src="options.js"></script>
</body>
</html>
